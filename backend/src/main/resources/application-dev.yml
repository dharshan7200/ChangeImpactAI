# ============================================================
# Dev profile overrides
# ============================================================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.changeimpact: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  security:
    jwt:
      secret: dev-only-secret-key-not-for-production-must-be-32-chars
    bcrypt:
      strength: 4   # Faster in dev; use 12 in prod

