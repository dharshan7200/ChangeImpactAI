# Prometheus for the full stack (docker-compose.full.yml): the backend is reachable as backend:8080.
# For a backend started on the host (mvn spring-boot:run / java -jar) use prometheus-host.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: changeimpact-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token   # = METRICS_SCRAPE_TOKEN of the backend
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
