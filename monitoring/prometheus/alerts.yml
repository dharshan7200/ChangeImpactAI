# Alert rules for ChangeImpact AI. Thresholds are starting points; tune them to your traffic.
groups:
  - name: changeimpact
    rules:
      - alert: ChangeImpactBackendDown
        expr: up{job="changeimpact-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The ChangeImpact AI backend cannot be scraped"
          description: "Prometheus has not reached /actuator/prometheus for 2 minutes (down, or the scrape token is wrong)."

      - alert: ChangeImpactJobFailures
        expr: sum(increase(changeimpact_jobs_total{outcome="failed"}[15m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "More than 3 indexing/analysis jobs failed in 15 minutes"
          description: "See the error messages of the jobs (UI, or GET /api/v1/jobs/repository/{id}); repeated failures usually mean Git, database or memory problems."

      - alert: ChangeImpactQueueBacklog
        expr: sum(changeimpact_queue_messages{queue!~".*\\.dlq"}) > 20
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "More than 20 jobs have been waiting for 15 minutes"
          description: "Consumers are saturated or stopped; check changeimpact_queue_consumers and app.ingestion.max-concurrent-jobs."

      - alert: ChangeImpactDeadLetters
        expr: sum(changeimpact_queue_messages{queue=~".*\\.dlq"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Job messages were dead-lettered"
          description: "Messages in the *.dlq queues could not be processed; inspect them in the RabbitMQ management UI."

      - alert: ChangeImpactWatchdogTimeouts
        expr: sum(increase(changeimpact_watchdog_timeouts_total{kind=~"running|queued"}[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "The job watchdog failed stuck jobs"
          description: "A job ran longer than app.ingestion.job-timeout-minutes or waited longer than queued-timeout-minutes."

      - alert: ChangeImpactHeapPressure
        expr: sum(jvm_memory_used_bytes{job="changeimpact-backend",area="heap"}) / sum(jvm_memory_max_bytes{job="changeimpact-backend",area="heap"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Backend heap above 90% for 10 minutes"
          description: "Large repositories need more heap (-Xmx) or fewer concurrent jobs (MAX_CONCURRENT_JOBS)."

      - alert: ChangeImpactHttp5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{job="changeimpact-backend",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="changeimpact-backend"}[5m])) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests fail with 5xx"
          description: "Check the backend log (secrets are masked) for the failing endpoints."
