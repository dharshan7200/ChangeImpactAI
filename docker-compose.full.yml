# ============================================================
# ChangeImpact AI — full stack (production-style)
# ============================================================
#   ./scripts/generate-env.sh            # once: creates .env with random secrets
#   docker compose -f docker-compose.full.yml up -d --build
#   open http://localhost:8088           (HTTP_PORT)
# Monitoring (Prometheus + Grafana):  add  --profile monitoring
#
# Only the web port is published. PostgreSQL, RabbitMQ, Redis and the backend are reachable from inside the
# compose network only; put a TLS-terminating reverse proxy (or load balancer) in front of the web port.
# Every secret comes from .env — compose refuses to start when one is missing (${VAR:?...}).
# ============================================================
name: changeimpact

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker's default 64 MB /dev/shm is too small for parallel queries on large repositories ("could not resize shared memory segment")
    shm_size: 256mb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-changeimpact}
      POSTGRES_USER: ${DB_USERNAME:-changeimpact}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — set it in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required — set it in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — set it in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_SEMGREP: ${INSTALL_SEMGREP:-true}
        APPLY_OS_UPDATES: ${APPLY_OS_UPDATES:-true}
    image: ${IMAGE_PREFIX:-changeimpact}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_PROFILE: prod
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-changeimpact}
      DB_USERNAME: ${DB_USERNAME:-changeimpact}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL (public URL of the web UI) is required — set it in .env}
      CHANGEIMPACT_PUBLIC_URL: ${CHANGEIMPACT_PUBLIC_URL:-${FRONTEND_URL}}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_WEB_BASE_URL: ${GITHUB_WEB_BASE_URL:-https://github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBED_PER_MINUTE: ${GEMINI_EMBED_PER_MINUTE:-100}
      GITHUB_CHECKS_FAIL_ON: ${GITHUB_CHECKS_FAIL_ON:-CRITICAL}
      GITHUB_CHECKS_FAIL_ON_SECURITY: ${GITHUB_CHECKS_FAIL_ON_SECURITY:-HIGH}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      RATE_LIMIT_WEBHOOK_PER_MINUTE: ${RATE_LIMIT_WEBHOOK_PER_MINUTE:-600}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_ANALYSES_DAYS: ${RETENTION_ANALYSES_DAYS:-180}
      RETENTION_REPORTS_DAYS: ${RETENTION_REPORTS_DAYS:-90}
      RETENTION_WEBHOOK_DAYS: ${RETENTION_WEBHOOK_DAYS:-30}
      JOB_TIMEOUT_MINUTES: ${JOB_TIMEOUT_MINUTES:-30}
      JOB_QUEUED_TIMEOUT_MINUTES: ${JOB_QUEUED_TIMEOUT_MINUTES:-720}
      INCREMENTAL_ANALYSIS_ENABLED: ${INCREMENTAL_ANALYSIS_ENABLED:-true}
      ANALYSIS_LANGUAGES: ${ANALYSIS_LANGUAGES:-all}
      LIBRARY_RESOLUTION_ENABLED: ${LIBRARY_RESOLUTION_ENABLED:-true}
      LIBRARY_REPOSITORY_URL: ${LIBRARY_REPOSITORY_URL:-https://repo.maven.apache.org/maven2}
      LIBRARY_MAX_ARTIFACTS: ${LIBRARY_MAX_ARTIFACTS:-400}
      LIBRARY_MAX_TOTAL_MB: ${LIBRARY_MAX_TOTAL_MB:-1024}
      LIBRARY_TIMEOUT_SECONDS: ${LIBRARY_TIMEOUT_SECONDS:-300}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - workspaces:/var/lib/changeimpact/workspaces
      - libraries:/var/lib/changeimpact/libraries
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-4g}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APPLY_OS_UPDATES: ${APPLY_OS_UPDATES:-true}
    image: ${IMAGE_PREFIX:-changeimpact}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:80"

  # ---- optional monitoring: docker compose -f docker-compose.full.yml --profile monitoring up -d ----
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_scrape_token]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

secrets:
  metrics_scrape_token:
    environment: METRICS_SCRAPE_TOKEN

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  workspaces:
  libraries:
  prometheus_data:
  grafana_data:
