# ============================================================
# ChangeImpact AI — Local Infrastructure Services
# ============================================================
# Services:
#   1. PostgreSQL 16 with pgvector extension
#   2. Redis 7 (caching, rate limiting)
#   3. RabbitMQ 3.13 with Management Web UI
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker's default 64 MB /dev/shm is too small for parallel queries on large repositories ("could not resize shared memory segment")
    shm_size: 256mb
    container_name: changeimpact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-changeimpact}
      POSTGRES_USER: ${DB_USERNAME:-changeimpact}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeimpact}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-changeimpact} -d ${DB_NAME:-changeimpact}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: changeimpact-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: changeimpact-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"   # Management Web UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Monitoring (optional): docker compose --profile monitoring up -d ----
  # Scrapes a backend started on this host (port 8080). Set METRICS_SCRAPE_TOKEN to the same value for the backend
  # and for this file (e.g. in .env). Grafana: http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: changeimpact-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_scrape_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: changeimpact-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # no plugin downloads from grafana.com
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"

secrets:
  metrics_scrape_token:
    environment: METRICS_SCRAPE_TOKEN

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

